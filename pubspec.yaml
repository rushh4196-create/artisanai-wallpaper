name: artisanai_wallpaper
description: "ARTISANAI — AI wallpapers, fresh every day. Landscape + portrait + live."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/artisanai-icon.png
    - assets/placeholders/landscape.jpg
    - assets/placeholders/portrait.jpg
    - assets/placeholders/live.jpg
