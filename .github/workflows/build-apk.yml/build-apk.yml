# ARTISANAI — free permanent cloud build (GitHub Actions)
# Runs on GitHub's runners, NOT on the local VM, so the Gradle daemon
# localhost problem on this VM never applies here.
# Public repo = standard Linux runners are free.
# Triggers: every push to main, and manual Run workflow.
# Output: app-debug.apk as a downloadable artifact (90 days).
name: Build ARTISANAI APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - name: Check Flutter
        run: flutter --version && flutter doctor -v
      - name: Get packages
        run: flutter pub get
      - name: Analyse
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: artisanai-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
